<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stocks Assistant Console</title>
  </head>
  <body>
    <script>
      (() => {
        const storedThemeValue = localStorage.getItem("stocks-assistant-theme");
        const storedTheme = ["system", "dark", "light"].includes(storedThemeValue) ? storedThemeValue : "system";
        const resolvedTheme = storedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : storedTheme;
        const storedMarketScheme = localStorage.getItem("stocks-assistant-color-scheme");
        const marketScheme = storedMarketScheme === "cn" ? "cn" : "intl";
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.style.colorScheme = resolvedTheme;
        document.documentElement.dataset.colorScheme = marketScheme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
